[project]
name = "fc-versions"
version = "0.1.0"
description = "Firecracker version build and release tooling"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.105.2,<0.106",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
