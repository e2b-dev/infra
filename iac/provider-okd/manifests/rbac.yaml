apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2b-kubernetes-orchestrator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2b-kubernetes-orchestrator
subjects:
  - kind: ServiceAccount
    name: e2b-kubernetes-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2b-kubernetes-orchestrator
---
# envd must run as UID 0 inside the Kata guest to launch processes as arbitrary
# sandbox users. This grants anyuid only to the tokenless sandbox ServiceAccount;
# the Pod still forbids host access, privilege escalation, and host networking.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2b-sandbox-anyuid
subjects:
  - kind: ServiceAccount
    name: e2b-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
