name: Monad Terraform Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monad-terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Keyless GCP configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read pinned Terraform version
        id: terraform-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '$1 == "terraform" { print $2; exit }' .tool-versions)"
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          # The rendered startup test pipes an expression to `terraform console`.
          # setup-terraform's output-capturing wrapper does not forward that
          # interactive stdin reliably on hosted Linux runners.
          terraform_wrapper: false

      - name: Install pinned Packer
        shell: bash
        env:
          PACKER_LINUX_AMD64_SHA256: c3401da41a47d51e2ef3e78a76f625c753b6f19e81681e4cdc3bc6e6f8c699c0
        run: |
          set -euo pipefail
          version="$(awk '$1 == "packer" { print $2; exit }' .tool-versions)"
          test -n "$version"
          archive="${RUNNER_TEMP}/packer_${version}_linux_amd64.zip"
          install_dir="${RUNNER_TEMP}/packer-bin"
          curl -fsSL \
            "https://releases.hashicorp.com/packer/${version}/packer_${version}_linux_amd64.zip" \
            -o "$archive"
          printf '%s  %s\n' "$PACKER_LINUX_AMD64_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod 0755 "$install_dir/packer"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Check formatting
        run: terraform fmt -check -recursive iac/provider-gcp

      - name: Initialise without a backend
        run: terraform -chdir=iac/provider-gcp init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=iac/provider-gcp validate

      - name: Verify pinned foundation toolchain
        run: make -C iac/provider-gcp foundation-toolchain-guard

      - name: Test keyless runtime identity
        run: make -C iac/provider-gcp keyless-runtime-check

      - name: Test workload topology and quota guards
        run: |
          make -C iac/provider-gcp workload-plan-assertions-test
          make -C iac/provider-gcp packer-reserve-check

      - name: Validate runtime image configuration
        run: |
          packer fmt -check iac/provider-gcp/nomad-cluster-disk-image
          packer init iac/provider-gcp/nomad-cluster-disk-image/main.pkr.hcl
          packer validate \
            -var 'gcp_project_id=keyless-validation' \
            -var 'gcp_zone=us-east4-a' \
            -var 'network_name=keyless-validation' \
            -var 'subnet_name=keyless-validation' \
            iac/provider-gcp/nomad-cluster-disk-image

      - name: Test foundation safety guards
        run: |
          iac/provider-gcp/scripts/test-foundation-guards.sh
          iac/provider-gcp/scripts/test-foundation-workflow.sh

      - name: Keep inherited automation dormant
        shell: bash
        run: |
          set -euo pipefail
          active_workflows="$(
            find .github/workflows -maxdepth 1 -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print | LC_ALL=C sort
          )"
          expected=".github/workflows/monad-terraform-validation.yml"
          if [[ "$active_workflows" != "$expected" ]]; then
            printf 'unexpected active workflows:\n%s\n' "${active_workflows:-<none>}" >&2
            exit 1
          fi

          test -f .github/upstream-workflows-disabled/pull-request.yml
          test -f .github/upstream-workflows-disabled/push-main.yml
          test -f .github/upstream-workflows-disabled/publish.yml
